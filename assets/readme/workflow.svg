<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGold {
        0%, 100% { stroke: #caa24a; stroke-opacity: 0.3; }
        50% { stroke: #e5c158; stroke-opacity: 0.9; }
      }
      @keyframes flowDot1 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
      @keyframes flowDot2 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
      @keyframes flowDot3 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulse-ring {
        animation: pulseGold 3s ease-in-out infinite;
      }
      .dot-1 {
        animation: flowDot1 2.2s linear infinite;
      }
      .dot-2 {
        animation: flowDot2 2.2s linear infinite 0.7s;
      }
      .dot-3 {
        animation: flowDot3 2.2s linear infinite 1.4s;
      }
      .live-dot {
        animation: liveBlink 1.8s ease-in-out infinite;
        transform-origin: 1045px 56px;
      }
    </style>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#caa24a" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#caa24a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#caa24a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" rx="14" fill="#0f1013" stroke="#efebe3" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top bar label -->
  <text x="40" y="38" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DATAFLOW &amp; ENGINE ARCHITECTURE</text>

  <!-- STEP 1: Discord Interaction -->
  <g transform="translate(40, 60)">
    <rect width="210" height="140" rx="10" fill="#14161a" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
    <rect width="210" height="4" rx="2" fill="#5865f2"/>
    <text x="20" y="36" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">1. Interaction</text>
    <text x="20" y="62" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">/add, /set, /remove</text>
    <text x="20" y="82" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">or @Bot Mention</text>
    <rect x="20" y="98" width="100" height="24" rx="4" fill="#5865f2" fill-opacity="0.15"/>
    <text x="70" y="114" text-anchor="middle" fill="#5865f2" font-family="sans-serif" font-size="11" font-weight="600">Discord API</text>
  </g>

  <!-- Flow 1 Connector -->
  <g transform="translate(250, 130)">
    <line x1="10" y1="0" x2="110" y2="0" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="10" cy="0" r="4" fill="#caa24a" class="dot-1"/>
  </g>

  <!-- STEP 2: SQLite Storage -->
  <g transform="translate(370, 60)">
    <rect width="220" height="140" rx="10" fill="#14161a" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
    <rect width="220" height="4" rx="2" fill="#003b57"/>
    <text x="20" y="36" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">2. Better-SQLite3</text>
    <text x="20" y="62" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Atomic Integer Cents</text>
    <text x="20" y="82" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Zero float precision drift</text>
    <rect x="20" y="98" width="112" height="24" rx="4" fill="#003b57" fill-opacity="0.4"/>
    <text x="76" y="114" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">WAL Engine</text>
  </g>

  <!-- Flow 2 Connector -->
  <g transform="translate(590, 130)">
    <line x1="10" y1="0" x2="110" y2="0" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="10" cy="0" r="4" fill="#caa24a" class="dot-2"/>
  </g>

  <!-- STEP 3: Canvas Renderer -->
  <g transform="translate(710, 60)">
    <rect width="210" height="140" rx="10" fill="#14161a" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
    <rect width="210" height="4" rx="2" fill="#caa24a"/>
    <text x="20" y="36" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">3. Canvas Engine</text>
    <text x="20" y="62" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">@napi-rs/canvas 2x</text>
    <text x="20" y="82" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Gold/Silver/Bronze</text>
    <rect x="20" y="98" width="124" height="24" rx="4" fill="#caa24a" fill-opacity="0.15"/>
    <text x="82" y="114" text-anchor="middle" fill="#caa24a" font-family="sans-serif" font-size="11" font-weight="600">Crisp 1800x PNG</text>
  </g>

  <!-- Flow 3 Connector -->
  <g transform="translate(920, 130)">
    <line x1="10" y1="0" x2="80" y2="0" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="10" cy="0" r="4" fill="#caa24a" class="dot-3"/>
  </g>

  <!-- STEP 4: Live Channel / Interactive Message -->
  <g transform="translate(1010, 60)">
    <rect width="150" height="140" rx="10" fill="#14161a" stroke="#caa24a" stroke-opacity="0.3" stroke-width="1.5" class="pulse-ring"/>
    <rect width="150" height="4" rx="2" fill="#57f287"/>
    <circle cx="120" cy="24" r="5" fill="#57f287" class="live-dot"/>
    <text x="18" y="36" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">4. Live Board</text>
    <text x="18" y="62" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Auto-ticks 60s</text>
    <text x="18" y="80" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Buttons paging</text>
    <rect x="18" y="98" width="114" height="24" rx="4" fill="#57f287" fill-opacity="0.12"/>
    <text x="75" y="114" text-anchor="middle" fill="#57f287" font-family="sans-serif" font-size="11" font-weight="600">Active Sync</text>
  </g>
</svg>