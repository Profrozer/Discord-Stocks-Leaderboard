<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="50%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#181a1e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="50%" stop-color="#caa24a"/>
      <stop offset="100%" stop-color="#9a7828"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111215" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#efebe3" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#gridPattern)"/>

  <!-- Border accent -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#caa24a" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(64, 52)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#caa24a" fill-opacity="0.12" stroke="#caa24a" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="14" cy="14" r="4" fill="#caa24a"/>
    <text x="26" y="18" fill="#e5c158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DISCORD BOT V2.0</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#efebe3" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-0.5">Discord Stocks Leaderboard</text>

    <!-- Subtitle -->
    <text x="0" y="122" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      High-performance shop spending ledger with dynamic image rendering
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="134" height="32" rx="6" fill="#1b1d22" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
      <text x="14" y="20" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ @napi-rs/canvas</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="126" height="32" rx="6" fill="#1b1d22" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
      <text x="160" y="20" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 SQLite WAL</text>

      <!-- Pill 3 -->
      <rect x="284" y="0" width="134" height="32" rx="6" fill="#1b1d22" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
      <text x="298" y="20" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔄 60s Live Sync</text>
    </g>

    <!-- Stat Counter Footprint -->
    <g transform="translate(0, 230)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#efebe3" stroke-opacity="0.1" stroke-width="1"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="#caa24a" stroke-width="2"/>

      <text x="0" y="36" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURRENCY</text>
      <text x="0" y="58" fill="#caa24a" font-family="Georgia, serif" font-size="18" font-weight="700">MYR (RM)</text>

      <text x="130" y="36" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STORAGE</text>
      <text x="130" y="58" fill="#efebe3" font-family="Georgia, serif" font-size="18" font-weight="700">Int Cents</text>

      <text x="260" y="36" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">DISCORD.JS</text>
      <text x="260" y="58" fill="#efebe3" font-family="Georgia, serif" font-size="18" font-weight="700">v14.19+</text>

      <text x="390" y="36" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">UPTIME BIO</text>
      <text x="390" y="58" fill="#57f287" font-family="Georgia, serif" font-size="18" font-weight="700">24/7 Live</text>
    </g>
  </g>

  <!-- Right Side: Graphic Mockup Card of the Leaderboard Render -->
  <g transform="translate(680, 42)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="456" height="316" rx="12" fill="url(#cardGrad)" stroke="#efebe3" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Header of preview card -->
    <rect width="456" height="42" rx="12" fill="#141519"/>
    <rect y="30" width="456" height="12" fill="#141519"/>
    <circle cx="24" cy="21" r="5" fill="#ed4245" fill-opacity="0.8"/>
    <circle cx="40" cy="21" r="5" fill="#faa61a" fill-opacity="0.8"/>
    <circle cx="56" cy="21" r="5" fill="#57f287" fill-opacity="0.8"/>
    <text x="228" y="26" text-anchor="middle" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1">PREVIEW • LEADERBOARD.PNG</text>

    <!-- Top Mini Brand -->
    <text x="24" y="66" fill="#caa24a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">SHOP LEADERBOARD</text>
    <text x="432" y="66" text-anchor="end" fill="#8d8a82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">PAGE 1 / 1</text>

    <line x1="24" y1="78" x2="432" y2="78" stroke="#efebe3" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="24" y1="78" x2="60" y2="78" stroke="#caa24a" stroke-width="2"/>

    <!-- Row 1: Gold Medal (#1) -->
    <g transform="translate(24, 92)">
      <rect width="408" height="52" rx="8" fill="#caa24a" fill-opacity="0.08" stroke="#caa24a" stroke-opacity="0.25" stroke-width="1"/>
      <text x="14" y="33" fill="#caa24a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">01</text>
      <!-- Avatar circle -->
      <circle cx="60" cy="26" r="16" fill="#caa24a" fill-opacity="0.25"/>
      <circle cx="60" cy="26" r="14" fill="#181a1e"/>
      <text x="60" y="31" text-anchor="middle" fill="#caa24a" font-family="sans-serif" font-size="13" font-weight="700">👑</text>
      <!-- Username -->
      <text x="88" y="31" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">RoyalCustomer</text>
      <!-- Price -->
      <text x="394" y="32" text-anchor="end" fill="#caa24a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">RM 4,850.00</text>
    </g>

    <!-- Row 2: Silver (#2) -->
    <g transform="translate(24, 152)">
      <rect width="408" height="46" rx="6" fill="#16181c" stroke="#efebe3" stroke-opacity="0.06" stroke-width="1"/>
      <text x="14" y="29" fill="#b4b9c1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">02</text>
      <circle cx="60" cy="23" r="13" fill="#b4b9c1" fill-opacity="0.2"/>
      <text x="60" y="28" text-anchor="middle" fill="#b4b9c1" font-family="sans-serif" font-size="11" font-weight="700">🥈</text>
      <text x="88" y="28" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">CyberWhale</text>
      <text x="394" y="29" text-anchor="end" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">RM 2,120.50</text>
    </g>

    <!-- Row 3: Bronze (#3) -->
    <g transform="translate(24, 204)">
      <rect width="408" height="46" rx="6" fill="#16181c" stroke="#efebe3" stroke-opacity="0.06" stroke-width="1"/>
      <text x="14" y="29" fill="#b8825a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">03</text>
      <circle cx="60" cy="23" r="13" fill="#b8825a" fill-opacity="0.2"/>
      <text x="60" y="28" text-anchor="middle" fill="#b8825a" font-family="sans-serif" font-size="11" font-weight="700">🥉</text>
      <text x="88" y="28" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">StarCollector</text>
      <text x="394" y="29" text-anchor="end" fill="#efebe3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">RM 1,490.00</text>
    </g>

    <!-- Interactive Button Bar Mockup -->
    <g transform="translate(24, 260)">
      <!-- Prev -->
      <rect x="0" y="0" width="60" height="28" rx="4" fill="#2b2d31"/>
      <text x="30" y="18" text-anchor="middle" fill="#8d8a82" font-family="sans-serif" font-size="12">◀</text>

      <!-- Indicator -->
      <rect x="68" y="0" width="70" height="28" rx="4" fill="#1e1f22"/>
      <text x="103" y="18" text-anchor="middle" fill="#8d8a82" font-family="sans-serif" font-size="11" font-weight="600">1 / 1</text>

      <!-- Next -->
      <rect x="146" y="0" width="60" height="28" rx="4" fill="#2b2d31"/>
      <text x="176" y="18" text-anchor="middle" fill="#8d8a82" font-family="sans-serif" font-size="12">▶</text>

      <!-- My Rank -->
      <rect x="224" y="0" width="94" height="28" rx="4" fill="#2b2d31"/>
      <text x="271" y="18" text-anchor="middle" fill="#efebe3" font-family="sans-serif" font-size="11" font-weight="600">🏅 My Rank</text>

      <!-- Refresh -->
      <rect x="326" y="0" width="82" height="28" rx="4" fill="#2b2d31"/>
      <text x="367" y="18" text-anchor="middle" fill="#efebe3" font-family="sans-serif" font-size="11" font-weight="600">🔄 Refresh</text>
    </g>
  </g>
</svg>